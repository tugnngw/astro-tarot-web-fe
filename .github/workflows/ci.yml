# Kiểm tra mỗi lần đẩy code: build được thì mới cho merge.
#
# Deploy production nằm ở `.github/workflows/cd.yml` (chỉ chạy trên `main`),
# gọi Vercel Deploy Hook — không nhét Vercel token đầy đủ vào secrets.
name: CI

on:
  push:
    branches: [main, develop, "feat/**", "feature/**"]
  pull_request:
    branches: [main, develop]

jobs:
  build:
    name: Build và lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Node 24, không phải 20. Hai lý do, cả hai đều đã làm CI đỏ thật:
      # - @tanstack/react-start đòi node >= 22.12.
      # - package-lock.json này do npm 11 (đi kèm Node 24) sinh ra; npm 10.8 của
      #   Node 20 giải cây phụ thuộc khác đi và báo thiếu lru-cache. Dùng đúng
      #   phiên bản Node như máy dev và Vercel thì `npm ci` mới tái lập được.
      - name: Cài Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      # npm ci chứ không phải npm install: cài đúng theo package-lock.json,
      # nên bản dựng ở CI giống hệt bản dựng ở máy.
      - name: Cài phụ thuộc
        run: npm ci

      - name: Build
        run: npm run build
        env:
          # Build cần biến này để nhúng URL backend. Đây là URL công khai,
          # không phải bí mật — trang nào cũng lộ nó trong bundle.
          VITE_API_BASE_URL: https://astra-tarot-api.onrender.com

      # Lint không chặn merge: repo còn nhiều cảnh báo cũ, để `continue-on-error`
      # cho tới khi dọn xong, nhưng vẫn in ra để thấy tình hình.
      - name: Lint
        run: npm run lint
        continue-on-error: true
