# Cấu hình quét SonarQube cho web.
#
# Chạy:
#   npm ci
#   npm run test:coverage          # sinh coverage/lcov.info
#   sonar-scanner -Dsonar.host.url=http://localhost:9000 -Dsonar.token=...
#
# Sonar KHÔNG tự chạy test. Nó chỉ đọc lcov.info đã có, nên bỏ bước
# test:coverage là Sonar báo 0% và người đọc tưởng repo không có test nào.

sonar.projectKey=astrotarot-web
sonar.projectName=AstroTarot Web
sonar.sourceEncoding=UTF-8

sonar.sources=src
sonar.tests=src
sonar.test.inclusions=src/**/*.test.ts,src/**/*.test.tsx

# routeTree.gen.ts do TanStack Router sinh ra mỗi lần chạy dev. Đo nó là đo
# công việc của công cụ, không phải công việc của mình — và nó làm con số tụt
# xuống mà không ai sửa được.
sonar.exclusions=src/routeTree.gen.ts,src/components/ui/**

# Thư mục ui/ là shadcn: chép nguyên từ thư viện, không sửa. Loại khỏi phép đo
# độ phủ vì viết test cho mã của người khác không nói gì về chất lượng của mình.
sonar.coverage.exclusions=src/routeTree.gen.ts,src/components/ui/**,src/**/*.test.ts,src/**/*.test.tsx

sonar.javascript.lcov.reportPaths=coverage/lcov.info
